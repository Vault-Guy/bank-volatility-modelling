[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-volatility-modelling"
version = "0.1.0"
description = "ARMA-GARCH/EGARCH analysis of Russian bank equities and the MOEX Financials Index"
requires-python = ">=3.10"
dependencies = [
  "arch>=7.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
